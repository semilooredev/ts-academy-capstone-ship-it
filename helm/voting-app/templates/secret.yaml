apiVersion: v1
kind: Secret
metadata:
  name: voting-db
  labels:
    {{- include "votingApp.componentLabels" (dict "context" . "component" "db") | nindent 4 }}
type: Opaque
stringData:
  # Demo-only credentials. They intentionally match the connection strings
  # in the upstream result/worker sample code and the local Compose file.
  # Never reuse these credentials outside this disposable capstone cluster.
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres
