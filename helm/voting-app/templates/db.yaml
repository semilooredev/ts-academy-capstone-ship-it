apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  labels:
    {{- include "votingApp.componentLabels" (dict "context" . "component" "db") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.persistence.size }}
  {{- with .Values.database.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    {{- include "votingApp.componentLabels" (dict "context" . "component" "db") | nindent 4 }}
spec:
  replicas: {{ .Values.database.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "votingApp.selectorLabels" (dict "component" "db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "votingApp.componentLabels" (dict "context" . "component" "db") | nindent 8 }}
    spec:
      securityContext:
        {{- include "votingApp.podSecurityContext" . | nindent 8 }}
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: db
          image: "{{ .Values.database.repository }}:{{ .Values.database.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: voting-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voting-db
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: voting-db
                  key: POSTGRES_DB
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          securityContext:
            {{- include "votingApp.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    {{- include "votingApp.componentLabels" (dict "context" . "component" "db") | nindent 4 }}
spec:
  selector:
    {{- include "votingApp.selectorLabels" (dict "component" "db") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
