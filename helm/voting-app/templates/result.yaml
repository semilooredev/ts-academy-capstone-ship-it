apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    {{- include "votingApp.componentLabels" (dict "context" . "component" "result") | nindent 4 }}
spec:
  replicas: {{ .Values.result.replicaCount }}
  selector:
    matchLabels:
      {{- include "votingApp.selectorLabels" (dict "component" "result") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "votingApp.componentLabels" (dict "context" . "component" "result") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "votingApp.podSecurityContext" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: result
          image: "{{ .Values.result.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.result.resources | nindent 12 }}
          securityContext:
            {{- include "votingApp.containerSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    {{- include "votingApp.componentLabels" (dict "context" . "component" "result") | nindent 4 }}
spec:
  type: {{ .Values.result.service.type }}
  selector:
    {{- include "votingApp.selectorLabels" (dict "component" "result") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.result.service.port }}
      targetPort: http
