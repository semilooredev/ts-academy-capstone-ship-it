apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    {{- include "votingApp.componentLabels" (dict "context" . "component" "vote") | nindent 4 }}
spec:
  replicas: {{ .Values.vote.replicaCount }}
  selector:
    matchLabels:
      {{- include "votingApp.selectorLabels" (dict "component" "vote") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "votingApp.componentLabels" (dict "context" . "component" "vote") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "votingApp.podSecurityContext" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: vote
          image: "{{ .Values.vote.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: OPTION_A
              value: {{ .Values.options.optionA | quote }}
            - name: OPTION_B
              value: {{ .Values.options.optionB | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.vote.resources | nindent 12 }}
          securityContext:
            {{- include "votingApp.containerSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  labels:
    {{- include "votingApp.componentLabels" (dict "context" . "component" "vote") | nindent 4 }}
spec:
  type: {{ .Values.vote.service.type }}
  selector:
    {{- include "votingApp.selectorLabels" (dict "component" "vote") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.vote.service.port }}
      targetPort: http
